version: 2


models:
  - name: job_postings
    description: Cleaned postings
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_id
        description: Unique identifier for the job posting
      - name: job_title
        description: Title of the job as posted.
      - name: company_name
        description: Name of the company that posted the job.
      - name: job_location
        description: Location (city/region) associated with the job posting.
      - name: job_via
        description: Job board or site the posting was found on (e.g. LinkedIn, Indeed).
      - name: job_schedule_type
        description: Type of work schedule (e.g. Full-time, Part-time, Contract).
      - name: job_work_from_home
        description: Boolean flag indicating if the job can be done remotely.
      - name: search_date
        description: Date the job posting was scraped/searched for.
      - name: search_term
        description: Search keyword/role used to find this job posting (e.g. "data analyst").

  - name: jobs_per_month
    description: Count of job postings per month and per searched role.
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: month
        description: First day of the month the postings were scraped on (search_date truncated to month).
      - name: role
        description: Search term/role the postings were grouped by (from search_term).
      - name: postings
        description: Number of job postings for this month/role combination.

  - name: top_locations
    description: Top 10 locations by number of job postings.
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_location
        description: Location (city/region) of the job postings.
      - name: postings
        description: Number of job postings in this location.
  
  - name: monthly_summary
    description: Monthly summary of job postings; one row per month.
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: month
        description: Year and month of the summary.
      - name: total_postings
        description: All postings that month (summed from jobs_per_month).
      - name: remote_postings
        description: Postings flagged remote that month.
      - name: pct_remote
        description: Share of the month's postings flagged remote, percent.
